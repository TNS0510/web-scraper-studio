<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Web Scraper Studio</h1>
            <p>Extract headings and links from any public website URL in seconds.</p>
        </header>

        <main>
            <form id="scraper-form">
                <div class="input-group">
                    <input 
                        type="url" 
                        id="url-input" 
                        placeholder="https://example.com" 
                        required
                    />
                    <button type="submit" id="submit-btn">Scrape Website</button>
                </div>
            </form>

            <div id="status-message" class="status"></div>

            <section id="results-section" class="hidden">
                <h2>Extracted Data (<span id="results-count">0</span>)</h2>
                <div id="results-container" class="results-grid"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
